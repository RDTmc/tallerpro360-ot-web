<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TallerPro360 — Órdenes de Trabajo</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
<div class="topbar-inner">
<span class="logo">TallerPro<span>360</span></span>
<div class="barra-usuario">
<span id="nombre-usuario"></span>
<button id="btn-login">Iniciar sesión</button>
<button id="btn-salir" class="oculto">Cerrar sesión</button>
</div>
</div>
</header>
<main class="contenedor">
<section class="card">
<div class="card-head">
<h2 class="titulo-seccion">Órdenes de trabajo</h2>
<button id="btn-consultar" disabled>Actualizar</button>
</div>
<input type="search" id="input-buscar" placeholder="Buscar por OT, cliente o patente…">
<p id="mensaje" class="mensaje"></p>
<ul id="lista-ot"></ul>
</section>
<section id="detalle" class="card oculto">
<div class="card-head">
<h2 id="detalle-titulo">Detalle</h2>
<div>
<button id="btn-eliminar" class="peligro">Eliminar</button>
<button id="btn-cerrar-detalle" class="secundario">Cerrar</button>
</div>
</div>
<div id="detalle-cuerpo"></div>
</section>
<section class="card">
<h2 class="titulo-seccion">Nueva orden</h2>
<form id="form-crear">
<h3 class="titulo-seccion">Cliente</h3>
<input type="search" id="input-buscar-cliente" placeholder="Buscar por RUT, nombre o código…" autocomplete="off">
<input type="hidden" id="input-cliente" value="">
<div id="sugerencias-cliente"><span class="muted">Busca por RUT (ej: 11111111-1), nombre o código (ej: CLI-001).</span></div>
<button type="button" id="btn-nuevo-cliente" class="secundario accion">+ Nuevo cliente</button>
<div id="modal-cliente" class="modal oculto">
<div class="modal-caja">
<div class="card-head">
<h3 class="titulo-seccion">Nuevo cliente</h3>
<button type="button" id="btn-cerrar-modal" class="secundario">✕</button>
</div>
<div class="grid2">
<input type="text" id="cli-rut" placeholder="RUT (ej: 55555555-5)" maxlength="12">
<input type="text" id="cli-codigo" placeholder="Código (ej: CLI-005)" maxlength="20">
</div>
<div class="grid2">
<input type="text" id="cli-nombres" placeholder="Nombres" maxlength="60">
<input type="text" id="cli-apellidos" placeholder="Apellidos" maxlength="60">
</div>
<div class="grid2">
<input type="date" id="cli-fecha">
<input type="email" id="cli-correo" placeholder="Correo" maxlength="100">
</div>
<input type="tel" id="cli-telefono" placeholder="Teléfono" maxlength="20">
<button type="button" id="btn-guardar-cliente">Guardar cliente</button>
</div>
</div>
<input type="text" id="input-patente" placeholder="Patente (ej: ZZXX99)" required maxlength="10">
<input type="text" id="input-descripcion" placeholder="Descripción" maxlength="200">
<div class="grid2">
<input type="number" id="input-total" placeholder="Total CLP" min="0" step="1" value="0">
</div>
<h3 class="titulo-seccion">Ítems</h3>
<div id="items"></div>
<button type="button" id="btn-agregar-item" class="secundario">+ Agregar ítem</button>
<button type="submit" disabled>Crear orden</button>
</form>
</section>
</main>
<script src="https://alcdn.msftauth.net/browser/2.35.0/js/msal-browser.min.js"></script>
<script src="utils.js"></script>
<script src="app.js"></script>
</body>
</html>
