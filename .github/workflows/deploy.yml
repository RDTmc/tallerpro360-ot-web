name: Deploy - ot-web (manual)
on:
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - run: aws s3 sync . s3://${{ vars.S3_BUCKET }}/static-ot/ --exclude ".github/*"
      - run: |
          aws ssm send-command --instance-ids ${{ vars.INSTANCE_ID }} \
            --document-name AWS-RunShellScript \
            --parameters "{\"commands\":[\"aws s3 sync s3://${{ vars.S3_BUCKET }}/static-ot/ /tmp/ot-web/ --exclude \\\".github/*\\\"\",\"sudo cp /tmp/ot-web/Index.html /var/www/ot/index.html\",\"sudo cp /tmp/ot-web/app.js /tmp/ot-web/styles.css /var/www/ot/\",\"curl -s https://${{ vars.SITE_DOMAIN }}/ | grep -o TallerPro360\"]}"
